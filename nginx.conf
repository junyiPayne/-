# Nginx 配置文件
# 运动健康系统 - 学生健康管理系统

# 上游服务器配置（后端）
upstream backend {
    server backend:5001;
    keepalive 32;
}

# HTTP 服务器配置
server {
    listen 80;
    # 局域网部署：使用服务器IP或留空（允许所有IP访问）
    # 公网部署：使用域名，如 server_name yourdomain.com www.yourdomain.com;
    server_name _;  # _ 表示接受所有域名，生产环境建议使用具体域名
    
    # 日志配置
    access_log /var/log/nginx/bs-system-access.log;
    error_log /var/log/nginx/bs-system-error.log;
    
    # 客户端最大请求体大小（用于文件上传）
    client_max_body_size 16M;
    
    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # 前端静态资源（JS/CSS/图片等）- 必须放在 /static 代理之前
    location ~* ^/static/(js|css|img|fonts|images)/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # API 代理
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 后端静态文件代理（头像、上传文件等）- 放在最后，匹配其他 /static 请求
    location /static {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 静态文件缓存
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # 健康检查
    location /api/health {
        proxy_pass http://backend;
        access_log off;
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}

