# 运动健康系统 - Docker Compose 配置
# 用于快速部署整个系统

name: bs-system

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bs-system-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    # 使用 docker-entrypoint.sh 自动初始化数据库（包括创建新表）
    # Dockerfile 中已经设置了 ENTRYPOINT，这里不需要覆盖
    # 如果需要跳过数据库初始化，取消注释下面这行并注释掉 Dockerfile 中的 ENTRYPOINT
    # entrypoint: ["gunicorn", "-c", "gunicorn.conf.py", "wsgi:app"]
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-bs_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-bs_system}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
    volumes:
      - ./backend/instance:/app/instance
      - ./backend/app/static:/app/app/static
      - ./backend/logs:/app/logs
      # 挂载代码目录，代码修改立即生效（开发模式）
      - ./backend/app:/app/app
      - ./backend/config.py:/app/config.py
      - ./backend/run.py:/app/run.py
      - ./backend/init_database.py:/app/init_database.py
      - ./backend/wsgi.py:/app/wsgi.py
      - ./docker-entrypoint.sh:/docker-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bs-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 数据库服务（MySQL，可选）
  db:
    image: mysql:8.0
    container_name: bs-system-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-bs_system}
      - MYSQL_USER=${DB_USER:-bs_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - bs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: bs-system-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - bs-network

volumes:
  db_data:
    driver: local

networks:
  bs-network:
    driver: bridge
