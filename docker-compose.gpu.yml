# 学生健康管理系统 - GPU 支持 Docker Compose 配置
# 用于 Windows 本地部署，支持 NVIDIA GPU

name: bs-system-gpu

services:
  # 后端服务（GPU 支持）
  backend:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: bs-system-backend-gpu
    restart: unless-stopped
    ports:
      - "8000:8000"  # 后端端口改为 8000
    # GPU 配置（Windows Docker Desktop）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # 环境变量
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-bs_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-bs_system}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:80,http://localhost:8080}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./backend/instance:/app/instance
      - ./backend/app/static:/app/app/static
      - ./backend/logs:/app/logs
      # 挂载代码目录，代码修改立即生效（开发模式）
      - ./backend/app:/app/app
      - ./backend/config.py:/app/config.py
      - ./backend/run.py:/app/run.py
      - ./backend/init_database.py:/app/init_database.py
      - ./backend/wsgi.py:/app/wsgi.py
      - ./docker-entrypoint.sh:/docker-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bs-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 数据库服务（MySQL 8.0）
  db:
    image: mysql:8.0
    container_name: bs-system-db-gpu
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-bs_system}
      - MYSQL_USER=${DB_USER:-bs_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - db_data_gpu:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - bs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Nginx 反向代理（前端）
  frontend:
    image: nginx:alpine
    container_name: bs-system-frontend-gpu
    restart: unless-stopped
    ports:
      - "80:80"  # 前端端口 80
    volumes:
      - ./nginx.gpu.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    environment:
      - NGINX_HOST=_
      - NGINX_PORT=80
    depends_on:
      - backend
    networks:
      - bs-network

volumes:
  db_data_gpu:
    driver: local

networks:
  bs-network:
    driver: bridge
